<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bgGrad)"/>
  <circle cx="300" cy="380" r="220" fill="#fee2e2" opacity="0.5"/>

  <g filter="url(#dropShadow)">
    <!-- Pump Mechanism -->
    <rect x="290" y="90" width="20" height="50" fill="#dc2626"/>
    <path d="M 270 90 L 330 90 L 330 110 L 250 110 Z" fill="#b91c1c"/>
    <rect x="280" y="140" width="40" height="20" rx="4" fill="#64748b"/>
    <rect x="285" y="160" width="30" height="20" fill="#cbd5e1"/>

    <!-- Bottle Body -->
    <rect x="200" y="180" width="200" height="420" rx="30" fill="url(#bottleGrad)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Red Cross Clinical Logo -->
    <rect x="285" y="220" width="30" height="10" rx="2" fill="#dc2626"/>
    <rect x="295" y="210" width="10" height="30" rx="2" fill="#dc2626"/>

    <!-- Medicube Typography -->
    <text x="300" y="280" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="24" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="3">medicube</text>
    
    <!-- RED LINE Clinical Label Box -->
    <rect x="225" y="305" width="150" height="26" rx="4" fill="#dc2626"/>
    <text x="300" y="323" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">RED CLEAR CICA</text>

    <!-- Subtitle & Actives -->
    <text x="300" y="365" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">BODY WASH</text>
    <text x="300" y="390" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">ACNE EXFOLIATING CARE</text>
    
    <text x="300" y="425" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">AHA • BHA • PHA Complex</text>
    <text x="300" y="445" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Centella Asiatica (Cica) 10,000ppm</text>
    <text x="300" y="465" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Hypoallergenic Tested</text>

    <line x1="240" y1="490" x2="360" y2="490" stroke="#e2e8f0" stroke-width="1.5"/>

    <text x="300" y="525" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">400 g / 14.10 oz.</text>

    <text x="300" y="640" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">MEDICUBE RED CLEAR CICA BODY WASH</text>
  </g>
</svg>
