<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bgGrad)"/>
  <circle cx="300" cy="380" r="220" fill="#fce7f3" opacity="0.5"/>

  <g filter="url(#dropShadow)">
    <!-- Main Squeeze Tube Packaging -->
    <path d="M 230 180 L 370 180 L 360 480 C 360 520 330 550 300 550 C 270 550 240 520 240 480 Z" fill="url(#tubeGrad)" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Top Crimped Seal -->
    <rect x="220" y="150" width="160" height="30" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="230" y1="165" x2="370" y2="165" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- SPF 50 Badge -->
    <rect x="260" y="210" width="80" height="24" rx="12" fill="#be185d"/>
    <text x="300" y="226" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SPF 50 PA+++</text>

    <!-- WishCare Logo -->
    <text x="300" y="270" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="24" font-weight="900" fill="#be185d" text-anchor="middle" letter-spacing="2">WishCare</text>
    
    <!-- Product Name -->
    <text x="300" y="300" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">CERAMIDE TINTED</text>
    <text x="300" y="320" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">LIP BALM</text>
    
    <!-- Key Actives -->
    <text x="300" y="360" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">KOJIC ACID • NIACINAMIDE</text>
    <text x="300" y="380" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">CHERRY RED TINT</text>

    <!-- Cherry Icon -->
    <circle cx="288" cy="425" r="14" fill="#be185d"/>
    <circle cx="312" cy="432" r="13" fill="#be185d"/>
    <path d="M 288 415 Q 300 395 305 385" stroke="#15803d" stroke-width="2.5" fill="none"/>
    <path d="M 312 420 Q 308 398 305 385" stroke="#15803d" stroke-width="2.5" fill="none"/>

    <!-- Bottom Twist Cap -->
    <rect x="270" y="550" width="60" height="50" rx="8" fill="#be185d"/>
    <line x1="285" y1="550" x2="285" y2="600" stroke="#9d174d" stroke-width="2"/>
    <line x1="300" y1="550" x2="300" y2="600" stroke="#9d174d" stroke-width="2"/>
    <line x1="315" y1="550" x2="315" y2="600" stroke="#9d174d" stroke-width="2"/>

    <!-- Footer Text -->
    <text x="300" y="660" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">WISHCARE CERAMIDE LIP BALM • 10g</text>
  </g>
</svg>
